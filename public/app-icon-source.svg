<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123d24"/>
      <stop offset="50%" stop-color="#1c6b3c"/>
      <stop offset="100%" stop-color="#36a35a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7d154"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4efe1"/>
      <stop offset="100%" stop-color="#e2dcc8"/>
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#123a22"/>
      <stop offset="100%" stop-color="#0a2416"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- three stacked containers, bold + simplified for small-size legibility -->
  <g>
    <rect x="76" y="150" width="360" height="84" rx="14" fill="url(#gold)"/>
    <line x1="112" y1="192" x2="400" y2="192" stroke="#b8830a" stroke-width="7" stroke-linecap="round"/>

    <rect x="76" y="248" width="360" height="84" rx="14" fill="url(#cream)"/>
    <line x1="112" y1="290" x2="400" y2="290" stroke="#b6ae95" stroke-width="7" stroke-linecap="round"/>

    <rect x="76" y="346" width="360" height="84" rx="14" fill="url(#dark)"/>
    <line x1="112" y1="388" x2="400" y2="388" stroke="#2d5a3a" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
